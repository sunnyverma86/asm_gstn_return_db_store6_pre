

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/TestingReturnPre?useSSL=false
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

    hikari:
      maximum-pool-size: 30

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true
        default_schema: public

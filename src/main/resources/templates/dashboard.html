<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>GSTN Enterprise Monitoring Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<!-- Header -->
<div th:insert="fragments/header :: header"></div>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:insert="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-3">

            <!-- Dashboard -->
            <div id="dashboardSection">
                <div th:insert="fragments/dashboard-home :: dashboardHome"></div>
            </div>

            <!-- Report Generation -->
            <div id="reportSection" style="display:none;">
                <div th:insert="fragments/report-generation :: reportGeneration"></div>
            </div>

            <!-- Last Update -->
            <div id="lastUpdateSection" style="display:none;">
                <div th:insert="fragments/last-update :: lastUpdate"></div>
            </div>

            <!-- Mismatch Analysis -->
            <div id="mismatchSection" style="display:none;">
                <div th:insert="fragments/mismatch-analysis :: mismatchAnalysis"></div>
            </div>

            <!-- Statistics -->
            <div id="statisticsSection" style="display:none;">
                <div th:insert="fragments/statistics :: statistics"></div>
            </div>

            <!-- System Health -->
            <div id="healthSection" style="display:none;">
                <div th:insert="fragments/system-health :: systemHealth"></div>
            </div>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>

<script th:src="@{/js/dashboard.js}"></script>

</body>
</html>

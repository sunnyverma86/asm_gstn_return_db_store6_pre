<div th:fragment="reportGeneration">

    <div class="card mt-3">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">
                Report Generation
            </h5>
        </div>

        <div class="card-body">

            <div class="row">

                <div class="col-md-3">
                    <label class="form-label">
                        From Date
                    </label>

                    <input type="date"
                           id="fromDate"
                           class="form-control">
                </div>

                <div class="col-md-3">
                    <label class="form-label">
                        To Date
                    </label>

                    <input type="date"
                           id="toDate"
                           class="form-control">
                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        Return Type (TY)
                    </label>

                    <select id="ty"
                            class="form-select">

                        <option value="R1">R1</option>
                        <option value="R1A">R1A</option>
                        <option value="R2B">R2B</option>
                        <option value="R3B">R3B</option>
                        <option value="R4">R4</option>
                        <option value="R5">R5</option>
                        <option value="R6">R6</option>
                        <option value="R7">R7</option>
                        <option value="R8">R8</option>
                        <option value="R98A">R98A</option>
                        <option value="R9C">R9C</option>
                        <option value="R9A">R9A</option>
                        <option value="R9">R9</option>
                        <option value="R10">R10</option>
                        <option value="R11">R11</option>
                        <option value="payment">PAYMENT</option>
                        <option value="CM8">CM8</option>
                        <option value="PARTA">PARTA</option>
                        <option value="PARTB">PARTB</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label class="form-label">
                        &nbsp;
                    </label>

                    <button id="generateBtn"
                            class="btn btn-success w-100">

                        Generate Report

                    </button>

                </div>

            </div>

            <hr>

            <div id="processingDiv"
                 class="alert alert-warning"
                 style="display:none">

                <span class="spinner-border spinner-border-sm"></span>
                Processing Report. Please Wait...

            </div>

            <div id="successDiv"
                 class="alert alert-success"
                 style="display:none">

                Report Generated Successfully

            </div>

            <div class="table-responsive">

                <table id="reportTable"
                       class="table table-bordered table-striped table-hover">

                    <thead class="table-dark">

                    <tr>

                        <th>DT</th>

                        <th>NUM FILES</th>

                        <th>FILE NUM</th>

                        <th>NUM FILES CNT</th>

                        <th>JSON DT</th>

                        <th>FILE NUMBER</th>

                        <th>JSON COUNT</th>

                        <th>STATUS</th>

                    </tr>

                    </thead>

                    <tbody></tbody>

                </table>

            </div>

            <div class="mt-3">

                <button class="btn btn-danger"
                        onclick="downloadPdf()">

                    Download PDF

                </button>

                <button class="btn btn-success"
                        onclick="downloadExcel()">

                    Download Excel

                </button>

            </div>

        </div>

    </div>

</div>

###################
# ==============================
# SERVER
# ==============================
server.tomcat.max-threads=100
server.tomcat.accept-count=50

# ==============================
# HIKARI CONNECTION POOL
# ==============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==============================
# JPA PERFORMANCE
# ==============================
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ==============================
# ASYNC TASK EXECUTOR (optional override)
# ==============================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ==============================
# LOGGING
# ==============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR
######################

logging.level.root=INFO

# Hide HikariCP logs
logging.level.com.zaxxer.hikari=ERROR

# Hide Apache HttpClient logs
logging.level.org.apache.http=ERROR
logging.level.org.apache.hc=ERROR

# Hide Spring Data Redis auto-scan logs
logging.level.org.springframework.data.redis=ERROR

# Reduce Spring noise
logging.level.org.springframework=INFO

# Reduce Hibernate noise
logging.level.org.hibernate=ERROR
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Jasypt Configuration
jasypt.encryptor.algorithm=PBEWithMD5AndDES
jasypt.encryptor.password=mySecretKeys

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.codec.max-in-memory-size=10MB


